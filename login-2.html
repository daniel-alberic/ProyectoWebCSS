<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- FAVICON Y/O LOGOTIPO DE PAGINA -->
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon" />

    <!-- LIBRERIA DE FUENTES -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- FRAMEWORK DE BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <!-- LIBRERIA DE ICONOS -->
    <script
      src="https://kit.fontawesome.com/812c8ee19a.js"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="CSS/login-2.css" />

    <script src="js/WE_MC_03_jquery.js"></script>
  </head>
  <body>
    <article class="container">
      <section class="row">
        <section class="col-xs-12 col-sm-6 col-md-6">
          <img
            src="img/catedral-huancayo-2.jfif"
            alt=""
            class="img-fluid first__img"
          />
        </section>
        <section class="col-xs-12 col-sm-6 col-md-6">
          <div>
            <img
              src="img/caja_huancayo.jpg"
              alt=""
              class="img-fluid second__img"
            />
          </div>

          <h1 class="titulo__login">Bienvenido Colaboradores</h1>

          <p class="parrafo__login">Ingrese sus credenciales</p>

          <div class="grupo__input">
            <input class="input__login" type="text" placeholder="Usuario" /><i
              class="fa-solid fa-user"
            ></i>
          </div>

          <div class="grupo__input">
            <input
              class="input__login"
              type="password"
              placeholder="Contraseña"
            />
            <i class="fa-solid fa-eye-slash"></i>
          </div>

          <div class="grupo__switch">
            <input class="input__switch" type="checkbox" id="recopilar" />
            <label for="recopilar" class="switch__label"> </label>
            <span class="texto__switch">Recordar Usuario</span>
          </div>

          <!-- CAPTCHA -->
          <div class="captcha-box">
            <div class="captcha-content">
              <input type="checkbox" id="check-robot" />
              <label for="check-robot">No soy un robot</label>
            </div>
            <div class="captcha-logo">
              <i class="fa-solid fa-rotate-right"></i>
              <span>reCAPTCHA</span>
              <small>Privacidad - Condiciones</small>
            </div>
          </div>

          <a class="enlace__login" href="#">¿Olvido sus credenciales?</a>
          <!-- FIN DE CAPTCHA -->

          <button class="boton__login">Ingresar</button>
        </section>
      </section>
    </article>

    <script src="js/WE_MC_02_headroom.min.js"></script>
    <script src="js/WE_MC_04_menu-flex.js"></script>
  </body>
</html>
